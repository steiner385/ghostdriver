[project]
name = "ghostdriver"
version = "0.2.0"
description = "An MCP server that drives desktop applications without taking the desktop from the person using it"
readme = "README.md"
requires-python = ">=3.11"
# SPDX expression (PEP 639), which is why the build needs setuptools 77+.
# No "License ::" classifier: setuptools refuses one alongside an expression.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tony Stein" }]
keywords = ["mcp", "desktop-automation", "ui-automation", "accessibility", "at-spi", "win32"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Desktop Environment",
]
dependencies = [
    "psutil>=5.9",
    "pywin32>=306; sys_platform == 'win32'",
    "comtypes>=1.2; sys_platform == 'win32'",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
    # The watches poll the display tens of times a second. Asking xprop for
    # each sample would mean spawning two processes per poll; a real X
    # connection is the difference between a watchdog and a fork bomb.
    "python-xlib>=0.33; sys_platform == 'linux'",
]

[project.optional-dependencies]
# mypy is bounded at both ends, unlike the other two. The type gate is a
# test, so a contributor on a different major answers a different question:
# 2.x reports things 1.x does not, and a floor alone lets the gate's verdict
# depend on who installed what and when. Bounded to what has been run (D#23).
dev = ["pytest>=8.0", "ruff>=0.16", "mypy>=2.1,<3"]
# The protocol layer only. The CLI and the library work without it, so a
# machine that only needs reconnaissance does not install a server SDK.
# Pinned to 2.x: FastMCP was renamed to MCPServer at that boundary, so 1.x
# and 2.x are not interchangeable.
server = ["mcp>=2.1,<3"]

[project.urls]
Homepage = "https://github.com/steiner385/ghostdriver"
Source = "https://github.com/steiner385/ghostdriver"
Issues = "https://github.com/steiner385/ghostdriver/issues"
Changelog = "https://github.com/steiner385/ghostdriver/blob/main/CHANGELOG.md"

[project.scripts]
ghostdriver = "ghostdriver.cli:main"
ghostdriver-mcp = "ghostdriver.mcp_server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: launches an engine, a hidden desktop, a server, or waits on a watchdog; excluded from the quick gate (pytest -m \"not slow and not clipboard\")",
    "clipboard: writes the person's clipboard (put back whole afterwards); excluded from the quick gate, since the person may be using it",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Correctness (F, B), style the formatter does not settle (E, W), import
# order (I), modernisation (UP), simplification (SIM, C4) and ruff's own
# catch-alls (RUF). Security and blind-except families are deliberately
# absent: the backends catch broad exceptions around Win32 calls on purpose,
# so one window that cannot be read does not take the enumeration with it.
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "SIM105",  # try/except/pass with a comment reads better than suppress()
    "SIM108",  # a three-way if is clearer than a nested ternary
    "UP042",   # (str, Enum) keeps str() of a member as the member's value
    "C408",    # dict(a=1) is a legitimate choice for keyword-shaped data
    "RUF005",  # list + list is not always clearer as a splat
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
# No `platform` here on purpose. One run assumes one platform and there are
# two backends, so the gate runs once per backend with `--platform` given on
# the command line; `tests/test_quality.py` is where that lives, and D#23 is
# why. A `platform` set here would be the bug it replaced, pointing the other
# way -- `backends/linux` checked as though it were Windows.
#
# `silent` is load-bearing for that, not a relaxation: `backends.load()`
# imports every backend, so without it the excluded backend is followed and
# reports under the wrong platform. Modules named on the command line are
# checked in full regardless, and the gate names the whole of `src`.
follow_imports = "silent"
# Strict where the design already types cleanly -- the platform-neutral
# modules that take their primitives by injection. The ctypes backends
# stay at the default, and get tightened as they are touched.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
