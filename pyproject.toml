[project]
name = "ghostdriver"
version = "0.1.0"
description = "Desktop automation MCP server"
requires-python = ">=3.11"
dependencies = [
    "psutil>=5.9",
    "pywin32>=306; sys_platform == 'win32'",
    "comtypes>=1.2; sys_platform == 'win32'",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# The protocol layer only. The CLI and the library work without it, so a
# machine that only needs reconnaissance does not install a server SDK.
# Pinned to 2.x: FastMCP was renamed to MCPServer at that boundary, so 1.x
# and 2.x are not interchangeable.
server = ["mcp>=2.1,<3"]

[project.scripts]
ghostdriver = "ghostdriver.cli:main"
ghostdriver-mcp = "ghostdriver.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
