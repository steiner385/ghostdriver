name: tests

# The suite is the gate. ruff and mypy run inside it (tests/test_quality.py),
# so a failing lint or type check is a failing test here too. The backend is
# Win32, and CLAUDE.md is explicit that a run on the wrong platform "looks
# like success" -- so this required check runs on Windows, where the backend
# tests actually execute rather than skip.
on:
  pull_request:
  push:
    branches: [main]

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (dev extras carry ruff and mypy; server carries mcp)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]"
      - name: Run the suite
        # PYTHONPATH=src matches the documented gate in CLAUDE.md.
        run: python -m pytest
        env:
          PYTHONPATH: src
